<text class="out r21" x="22" y="478">WHAT THE DATA SUPPORTS</text>
<text class="dim r22" x="22" y="497">======================</text>
<text class="num r23" x="22" y="516">  - Volatility is 49.7% annualised, currently at the 43% percentile of its own history.</text>
<text class="out r24" x="22" y="535">  - Returns are fat-tailed (excess kurtosis 6.4), so size positions on CVaR rather than on …</text>
<text class="out r25" x="22" y="554">  - Volatility shocks decay with a 8-day half-life, so a volatility spike is informative …</text>
<text class="out r26" x="22" y="573">  - The historical Sharpe ratio of 1.01 IS statistically distinguishable from zero over this …</text>
<text class="out r27" x="22" y="592">  - Returns load significantly on market, rates_10y, credit_hy, leaving 53% idiosyncratic.</text>
<text class="out r28" x="22" y="611">  - None of 9 standard signals predicts this instrument after correcting for multiple testing.</text>
<text class="out r29" x="22" y="630">  NOT established by this report:</text>
<text class="out r30" x="22" y="649">  - anything about the future; every number above is descriptive</text>
<text class="out r31" x="22" y="668">  - fundamental value, earnings quality, or anything not in the price</text>
<text class="out r32" x="22" y="687">  - liquidity, borrow availability, or capacity</text>
