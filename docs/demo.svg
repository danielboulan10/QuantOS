<text class="out r48" x="22" y="991">  The fixed-rate projection of 198,290 is not the expected outcome: it is roughly the 56th …</text>
<text class="out r49" x="22" y="1010">  returns are drawn independently each period; real returns are close to independent monthly …</text>
