name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      # Doctests run as part of the suite: every worked example in every
      # docstring is executed, so documentation cannot drift from behaviour.
      - run: pytest -q --durations=15
      # Network tests are deselected by default; run them on Linux/3.12 only, and
      # do not fail the build if a third party is having a bad day.
      - name: live data smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          pytest -m network -q || echo "network tests unavailable; continuing"
        continue-on-error: true

  runtime-dependency-audit:
    # Enforces DDR-002. Installs WITHOUT the test extra, so SciPy is absent, then
    # imports every module. If any runtime module has grown a SciPy import, this
    # fails -- which is the only reliable way to keep the promise.
    name: numpy-only runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: assert scipy is not installed
        run: |
          if python -c "import scipy" 2>/dev/null; then
            echo "::error::scipy is importable in a runtime-only install; DDR-002 violated"
            exit 1
          fi
          echo "scipy correctly absent"
      - name: every module imports with numpy alone
        run: quantos doctor
      - name: the CLI works without scipy
        run: |
          quantos options
          quantos book --operations 20000
          quantos execution
          quantos analyse --list
          # The data layer reaches FRED with urllib alone. If this step ever needs
          # a package installed, DDR-002 has been violated.
          quantos analyse --series spx --start 2020-01-01 \
            || echo "FRED unreachable from this runner; tests cover the offline path"
          # `quantos probability` exits 1 when a Monte Carlo estimate misses its
          # analytic value, which is correct behaviour for a verification command
          # and WRONG as a build gate: it is a statistical test, so it fails by
          # design some fraction of the time. It did, on the very first CI run.
          # The statistical claim is properly covered by
          # tests/probability/test_problems.py, which uses fixed seeds and
          # per-problem tolerances. Here we only assert the command runs.
          quantos probability --samples 4000 || true

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[test]"
      - run: pytest --cov --cov-report=term-missing --cov-report=xml -q
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  container:
    # The Dockerfile is a claim that a clean machine can run this. Unverified,
    # it is a claim that rots on the first dependency change -- so CI builds the
    # image and runs the suite inside it rather than trusting that it still works.
    name: container builds and passes its own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: quantos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the packaged CLI works
        run: docker run --rm quantos:ci quantos --version
      - name: the runtime picked up no dependency beyond NumPy
        run: |
          docker run --rm quantos:ci python - <<'PY'
          import importlib.metadata as md
          installed = {d.metadata["Name"].lower() for d in md.distributions()}
          # pip/setuptools/wheel ship with the base image; nothing else may.
          allowed = {"quantos", "numpy", "pip", "setuptools", "wheel"}
          extra = installed - allowed
          assert not extra, f"unexpected packages in the runtime image: {sorted(extra)}"
          print("runtime image contains only:", sorted(installed))
          PY
      - name: setup is one command from a clean checkout
        run: make setup && make lint

  docs:
    # The README makes specific promises -- a demo, screenshots, an
    # architecture diagram. A broken link or a stale demo is a wrong claim, so
    # it is checked like every other claim here.
    name: docs and demo are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[test]"
      - name: every file the README links to exists
        run: python scripts/check_links.py
      - name: the recorded demo matches the current version
        run: pytest tests/scripts -q

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests benchmarks scripts
      - run: ruff format --check src tests
      - run: mypy

  reproducibility:
    # A simulation that is not bit-reproducible is not a research instrument.
    # This runs the same seed twice and requires identical output.
    name: bit-exact reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[test]"
      - name: same seed produces identical output
        run: |
          # Strip the wall-clock line before diffing. It is genuine output but it
          # is not part of the reproducibility claim -- the claim is that the
          # *simulation* is bit-exact, not that two runs take equally long. An
          # earlier version diffed it and failed intermittently on a busy runner.
          quantos simulate --seconds 3 --seed 12345 | grep -v 'wall time' > run1.txt
          quantos simulate --seconds 3 --seed 12345 | grep -v 'wall time' > run2.txt
          diff run1.txt run2.txt && echo "bit-exact across runs"
          test -s run1.txt

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[test]"
      - run: python benchmarks/run_benchmarks.py

  cpp-extension:
    # The C++ book is optional, so it would be easy for it to rot unnoticed: the
    # rest of the suite passes without it. This job builds it and re-runs the
    # exchange tests against the compiled backend, so the equivalence test is
    # actually exercised rather than skipped.
    name: C++ backend equivalence
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[test]"
      - name: build the extension
        run: python scripts/build_extension.py
      - name: confirm the compiled backend is the one in use
        run: |
          python scripts/build_extension.py --check
          python - <<'PY'
          from quantos.exchange.book import BACKEND
          assert BACKEND == "cpp", f"expected the C++ backend, got {BACKEND!r}"
          print("backend:", BACKEND)
          PY
      - name: the two implementations agree
        run: python -m pytest tests/exchange -q
      - name: batched replay throughput
        run: |
          python - <<'PY'
          from quantos.exchange.replay import replay_tape, synthetic_tape
          result, _ = replay_tape(synthetic_tape(1_000_000, seed=7))
          print(f"{result.operations_per_second:,.0f} ops/s over {result.operations:,} ops")
          assert result.operations_per_second > 1e6, "batched replay lost an order of magnitude"
          PY

  claims:
    # Every headline number in the documentation is re-derived here. Prose rots
    # silently -- a refactor moves a constant, the README keeps quoting the old
    # figure, and nothing fails. This makes that failure loud.
    #
    # It also guards against the specific mistake this project has made: quoting a
    # single favourable run. The price-discovery correlation was once reported as
    # 0.78 (best of three seeds; the truth was 0.29 over sixteen) and the C++
    # throughput as a six-digit number from one run of a range spanning 2x.
    name: documented claims still hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[test]"
      - name: build the C++ book so its throughput claim is checked too
        run: python scripts/build_extension.py || true
      - run: python scripts/verify_claims.py

  gallery:
    # The gallery must stay regenerable: a figure that only exists because it was
    # committed once is a figure that will silently go stale.
    name: gallery regenerates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[test]"
      - run: python scripts/build_gallery.py --out /tmp/gallery
      - name: every figure was produced
        run: |
          count=$(ls /tmp/gallery/*.svg | wc -l)
          echo "generated $count figures"
          test "$count" -ge 10
